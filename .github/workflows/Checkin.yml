name: Ayrouter Daily Check-in

on:
  workflow_dispatch:
  schedule:
    # 06:45 Asia/Shanghai = 22:45 UTC on the previous day.
    - cron: '45 22 * * *'

permissions:
  contents: read

concurrency:
  group: daily-checkin
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install preparation dependencies
        run: python -m pip install requests playwright==1.64.1
      - name: Build public account manifest
        env:
          CHECKIN_CONFIG: ${{ secrets.CHECKIN_CONFIG }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: python routing.py prepare --manifest manifest.json
      - uses: actions/upload-artifact@v6
        with:
          name: checkin-manifest
          path: manifest.json
          if-no-files-found: error
          retention-days: 1

  plan:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v7
        with:
          name: checkin-manifest
          path: assignment
      - name: Build credential-free OS and slot matrix
        id: plan
        run: python routing.py matrix --manifest assignment/manifest.json

  checkin:
    needs: [prepare, plan]
    if: needs.prepare.result == 'success' && needs.plan.result == 'success' && needs.plan.outputs.matrix != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix || '{"include":[{"os":"ubuntu-24.04","slot":0}]}') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download public account assignment
        uses: actions/download-artifact@v7
        with:
          name: checkin-manifest
          path: assignment
      - name: Validate the assigned slot and runner
        run: python routing.py assign --manifest assignment/manifest.json --slot ${{ matrix.slot }} --runner ${{ matrix.os }}
      - name: Install dependencies
        run: python -m pip install requests playwright==1.64.1 pynacl pysocks
      - name: Cache Chromium
        id: browser-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-1.64.1
      - name: Install Linux browser system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium
      - name: Set up legacy Linux proxy
        if: env.CHECKIN_MODE == 'legacy'
        shell: bash
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
          PROXY_CONFIG_URL: ${{ secrets.PROXY_CONFIG_URL }}
        run: bash setup-proxy.sh
      - name: Run assigned accounts without notifications
        env:
          CHECKIN_CONFIG: ${{ secrets.CHECKIN_CONFIG }}
          CHECKIN_MODE: ${{ env.CHECKIN_MODE }}
          GROUP_ID: ${{ env.GROUP_ID }}
          RUNNER_KEY: ${{ matrix.os }}
          ACCOUNT_IDS: ${{ env.ACCOUNT_IDS }}
          RANDOM_PLAN: ${{ env.RANDOM_PLAN }}
          RESULT_PATH: ${{ runner.temp }}/result.json
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
        run: python app.py
      - name: Upload only the safe group report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: checkin-results-${{ env.GROUP_ID }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: warn
          retention-days: 1

  notify:
    needs: [prepare, plan, checkin]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install summary dependencies
        run: python -m pip install requests playwright==1.64.1
      - name: Restore previous successful account balances
        id: history-restore
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: .superpowers/checkin-history/balances.json
          key: checkin-balances-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            checkin-balances-v1-${{ github.ref_name }}-
      - name: Report safe history restore status
        if: always()
        env:
          CACHE_OUTCOME: ${{ steps.history-restore.outcome }}
          CACHE_RESTORED: ${{ steps.history-restore.outputs.cache-matched-key != '' }}
        run: >-
          python -c "import os; print('HISTORY_CACHE_RESTORE_FAIL' if os.environ['CACHE_OUTCOME'] != 'success'
          else 'HISTORY_CACHE_RESTORED' if os.environ['CACHE_RESTORED'] == 'true' else 'HISTORY_CACHE_MISSING')"
      - name: Download expected manifest
        if: needs.prepare.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: checkin-manifest
          path: reports
      - name: Download completed group reports
        if: needs.prepare.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: checkin-results-*
          path: reports
          merge-multiple: false
      - name: Send one final aggregate after every group ends
        env:
          CHECKIN_CONFIG: ${{ secrets.CHECKIN_CONFIG }}
          CHECKIN_MODE: ${{ secrets.CHECKIN_CONFIG != '' && 'isolated' || 'legacy' }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BALANCE_HISTORY_PATH: .superpowers/checkin-history/balances.json
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python report.py notify --manifest reports/manifest.json --reports-dir reports
      - name: Preserve successful balances even if another account failed
        id: history-save
        if: always() && env.BALANCE_HISTORY_READY == 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: .superpowers/checkin-history/balances.json
          key: checkin-balances-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report safe history save status
        if: always() && env.BALANCE_HISTORY_READY == 'true'
        env:
          CACHE_OUTCOME: ${{ steps.history-save.outcome }}
        run: >-
          python -c "import os; print('HISTORY_CACHE_SAVE_SUCCESS' if os.environ['CACHE_OUTCOME'] == 'success'
          else 'HISTORY_CACHE_SAVE_FAIL')"

  maintenance:
    needs: [prepare, plan, checkin, notify]
    if: always() && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Clear old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run list --workflow "${{ github.workflow }}" --limit 100 \
            --json databaseId --jq '.[].databaseId' | tail -n +2 | while read -r run_id; do
            gh run delete "$run_id" || true
          done
      - name: Keep repository alive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          last_commit=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last_commit) / 86400 ))
          if [ "$days" -ge 40 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            date -u '+Keepalive: %Y-%m-%d %H:%M:%S UTC' > .github/keepalive.txt
            git add .github/keepalive.txt
            git commit -m 'chore: keep workflow alive [skip ci]'
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
