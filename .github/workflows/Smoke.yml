name: Credential-free platform smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install requests playwright==1.64.1 pynacl pysocks
      - if: runner.os == 'Linux'
        run: python -m playwright install-deps chromium
      - run: python -m playwright install chromium
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: bash -n setup-proxy.sh
      - run: python tests/smoke.py
