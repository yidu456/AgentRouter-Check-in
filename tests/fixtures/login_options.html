<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"></head>
<body>
<nav><a href="/login">登录</a><a href="/register">注册</a></nav>
<main>
<section id="options">
  <button type="button">使用 GitHub 继续</button>
  <button type="button">使用 LinuxDO 继续</button>
  <button type="button" id="email">使用 <span>邮箱或用户名</span> 登录</button>
</section>
<form id="login" hidden>
  <label for="username">用户名或邮箱</label>
  <input id="username" name="username" type="text" placeholder="请输入您的用户名或邮箱地址">
  <label for="password">密码</label>
  <input id="password" name="password" type="password" placeholder="请输入您的密码">
  <button type="submit">继续</button>
  <button type="button">忘记密码？</button>
</form>
</main>
<script>
document.getElementById('email').onclick = () => {
  document.getElementById('options').hidden = true;
  document.getElementById('login').hidden = false;
};
document.getElementById('login').onsubmit = event => {
  event.preventDefault();
  localStorage.setItem('user', JSON.stringify({id: 1}));
};
</script>
</body>
</html>
